<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Settings</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body class="loading">
  <svg class="sprite" aria-hidden="true">

    <symbol id="i-appearance" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.8-.9 1.8-1.8 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-1 .8-1.8 1.8-1.8h2.1A4.3 4.3 0 0 0 21 10.7C21 6.4 17 3 12 3z"/><circle cx="7.5" cy="11.5" r="1"/><circle cx="10.5" cy="7.5" r="1"/><circle cx="15.5" cy="8.5" r="1"/></symbol>
    <symbol id="i-privacy" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-blocking" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></symbol>
    <symbol id="i-downloads" viewBox="0 0 24 24"><path d="M12 4v11"/><path d="M7.5 10.5L12 15l4.5-4.5"/><path d="M5 19h14"/></symbol>
    <symbol id="i-about" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  </svg>

  <div id="app">
    <nav class="nav" aria-label="Settings sections">
      <div class="nav-head">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect x="1" y="1" width="30" height="30" rx="9" class="mark-bg"/>
          <path d="M9 21.5c0-6 4-10 10-10h4" class="mark-stroke"/>
          <path d="M19.5 7.5l4 4-4 4" class="mark-stroke"/>
          <circle cx="10" cy="22" r="2.2" class="mark-dot"/>
        </svg>
        <span>Settings</span>
      </div>
      <label class="nav-search">
        <svg class="ico"><use href="#i-search"/></svg>
        <input id="find" type="text" placeholder="Search settings" autocomplete="off" spellcheck="false">
      </label>
      <div id="nav-links" class="nav-links"></div>
    </nav>
    <main id="content" class="content" tabindex="-1"></main>
  </div>

  <div id="confirm" class="scrim" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
      <h2 id="confirm-title"></h2>
      <p id="confirm-text"></p>
      <div class="dialog-actions">
        <button id="confirm-cancel" class="btn">Cancel</button>
        <button id="confirm-ok" class="btn danger"></button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>
  <script src="settings.js"></script>
</body>
</html>
